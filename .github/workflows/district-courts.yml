# JurisBound - District court orders (folder: district-court/web).
# Website date search + eCourts app lookup -> PDFs to Azure Blob Storage, rows
# to the Azure database (schema jb_kb), index + "done up to" markers in storage.
#
# The chosen states are cut into groups of whole districts (about
# `complexes_per_job` court complexes each; .github/scripts/plan_groups.py),
# and each group is one job. Jobs run side by side, at most 20 at a time; the
# rest wait in a queue. Each job runs on its own GitHub machine with its own
# internet address at the scraper's normal gentle pace, so speed comes from
# more jobs, not from more workers inside a job (that gets an address blocked).
#
# Groups never share a court complex, and the storage index and markers are
# kept per complex, so the jobs of one run never write the same files. Two
# runs of this workflow never run at once (they could pick the same complex);
# a second run waits until the first has finished.
#
# Dates: give start_date + end_date for a first run. In the automatic mode
# (dates empty) each complex continues from its own "done up to" marker, and a
# complex with no marker starts from 1 January.
#
# Daily schedule (test, October 2026): ALL states, YESTERDAY only (India time,
# worked out once when the run starts), never the automatic mode -- most
# complexes have no marker yet and would start from 1 January. A dated run
# also sets each finished complex's marker. GitHub starts scheduled runs 4-6 h
# late, so "yesterday" is the day before the run actually starts.

name: JurisBound – District courts

on:
  schedule:
    - cron: "0 17 * * *"      # 22:30 IST
  workflow_dispatch:
    inputs:
      state_codes:
        description: "State code(s), comma-separated (e.g. 29 = Telangana), or 'all'."
        required: true
        default: "29"
      complexes_per_job:
        description: "About how many court complexes one job handles (whole districts are kept together)."
        required: false
        default: "30"
      start_date:
        description: "Start date YYYY-MM-DD. Empty = automatic (from each complex's marker)."
        required: false
        default: ""
      end_date:
        description: "End date YYYY-MM-DD. Empty = today."
        required: false
        default: ""
      timeout_hours:
        description: "Stop starting new work after this many hours (GitHub stops jobs at 6)."
        required: false
        default: "5.5"

concurrency:
  group: district-courts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    # Turns the boxes into the list of jobs (groups of districts).
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
      start: ${{ steps.dates.outputs.start }}
      end: ${{ steps.dates.outputs.end }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Choose the dates
        # Scheduled run: yesterday in India time, the same for every job.
        # Manual run: the dates in the boxes (empty = automatic mode).
        id: dates
        env:
          IN_START: ${{ github.event.inputs.start_date }}
          IN_END: ${{ github.event.inputs.end_date }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            Y=$(TZ=Asia/Kolkata date -d yesterday +%F)
            echo "start=$Y" >> "$GITHUB_OUTPUT"; echo "end=$Y" >> "$GITHUB_OUTPUT"
          else
            echo "start=$IN_START" >> "$GITHUB_OUTPUT"; echo "end=$IN_END" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Make the list of jobs
        id: groups
        env:
          IN_STATES: ${{ github.event.inputs.state_codes || 'all' }}
          IN_PER_JOB: ${{ github.event.inputs.complexes_per_job || '30' }}
        run: |
          python3 .github/scripts/plan_groups.py "$IN_STATES" "$IN_PER_JOB" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  scrape:
    needs: plan
    name: ${{ matrix.group.name }} (${{ matrix.group.complexes }} complexes)
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false          # one job failing or blocked does not stop the others
      max-parallel: 20          # GitHub free plan: at most 20 jobs at once
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      # App lookup on, as on the laptop.
      DC_LOOKUP: mobile
      # Azure: orders into schema jb_kb as the login jb_court, PDFs into Azure Blob
      DATABASE_URL: ${{ secrets.AZURE_KB_ASYNC_DATABASE_URL }}
      SYNC_DATABASE_URL: ${{ secrets.AZURE_KB_DATABASE_URL }}
      STORAGE_BACKEND: azure
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      # Container name (the code still calls it the bucket). Not a secret.
      SUPABASE_S3_BUCKET: court-documents

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: district-court/requirements.txt

      - name: Install Ghostscript (PDF compression)
        run: sudo apt-get update -q && sudo apt-get install -y -q ghostscript

      - name: Install Python packages
        # CPU-only PyTorch for the CAPTCHA reader -- the default build is
        # several GB of GPU libraries the runner cannot use.
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r district-court/requirements.txt

      - name: Make this job's court list
        env:
          IN_STATE: ${{ matrix.group.state }}
          IN_DISTRICTS: ${{ matrix.group.districts }}
        run: |
          echo "State $IN_STATE, districts $IN_DISTRICTS"
          python3 .github/scripts/plan_groups.py --write "$IN_STATE" "$IN_DISTRICTS" "$RUNNER_TEMP/courts.csv"

      - name: Run the district scraper
        working-directory: district-court/web
        env:
          IN_START: ${{ needs.plan.outputs.start }}
          IN_END: ${{ needs.plan.outputs.end }}
          IN_TIMEOUT: ${{ github.event.inputs.timeout_hours || '5.5' }}
        run: |
          ARGS="--sync-s3 --timeout-hours $IN_TIMEOUT --courts_csv $RUNNER_TEMP/courts.csv"
          [ -n "$IN_START" ] && ARGS="$ARGS --start_date $IN_START"
          [ -n "$IN_END" ]   && ARGS="$ARGS --end_date $IN_END"
          echo "Running: python download.py $ARGS"
          # Exit code 2 = the court website blocked this runner's address.
          python download.py $ARGS
